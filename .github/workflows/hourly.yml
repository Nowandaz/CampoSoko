# Free hourly trigger for the AI pass (Vercel's free plan only allows one cron run per day).
# Add two repository secrets: SITE_URL (e.g. https://camposoko.vercel.app) and CRON_SECRET (same as in Vercel).
name: Hourly AI pass
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call the AI endpoint
        run: |
          curl --fail --silent --show-error --max-time 90 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/ai"
